# apexgainesville.com — Netlify configuration
# Version-controlled so deploy settings cannot drift in the dashboard.

[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Squarespace URLs this rebuild drops. Members still have these in old emails
# and bookmarks, so every one of them lands somewhere useful rather than 404.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/our-studio/"
  status = 301

[[redirects]]
  from = "/classes"
  to = "/the-workout/"
  status = 301

[[redirects]]
  from = "/education"
  to = "/training/"
  status = 301

[[redirects]]
  from = "/locations-1"
  to = "/locations/"
  status = 301

[[redirects]]
  from = "/cart"
  to = "/pricing/"
  status = 301

[[redirects]]
  from = "/book-now"
  to = "/schedule/"
  status = 301

[[redirects]]
  from = "/teacher-form"
  to = "/training/"
  status = 301

[[redirects]]
  from = "/flooring-schedule"
  to = "/schedule/"
  status = 301

[[redirects]]
  from = "/account"
  to = "/account-management/"
  status = 301

# Hiring for every RAD studio runs through one application on radcollective.us.
# force = true because a /careers/ page still ships and would otherwise win.
[[redirects]]
  from = "/careers"
  to = "https://radcollective.us/apply/"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
